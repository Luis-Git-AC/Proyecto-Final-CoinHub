services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/coinhub
      # Valores de desarrollo local — NO usar estos valores en producción.
      JWT_SECRET: dev-secret-change-me-in-production
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URLS: http://localhost:8080
      # La subida de imágenes (posts/recursos) no funcionará sin credenciales
      # reales de Cloudinary; el resto de la app (auth, portfolio, posts sin
      # imagen) sí funciona con estos valores de relleno.
      CLOUDINARY_CLOUD_NAME: changeme
      CLOUDINARY_API_KEY: changeme
      CLOUDINARY_API_SECRET: changeme
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
